name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  coverage:
    name: coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      # Per crate, not workspace-wide, so a well-covered core cannot mask an
      # untested client. Thresholds from design/testing.md [TST-008].
      - name: fifolio-core (95%)
        run: cargo llvm-cov --package fifolio-core --fail-under-lines 95

      - name: fifolio-server (90%)
        run: cargo llvm-cov --package fifolio-server --fail-under-lines 90

      # The TUI render layer is excluded because it draws; what it draws is
      # decided in the UI-agnostic client layer, which is not excluded [TST-009].
      - name: fifolio-cli (75%, render layer excluded)
        run: >
          cargo llvm-cov --package fifolio-cli
          --ignore-filename-regex 'crates/fifolio-cli/src/tui/render/'
          --fail-under-lines 75
