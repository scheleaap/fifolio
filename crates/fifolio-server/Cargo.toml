[package]
name = "fifolio-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
fifolio-core = { version = "0.1.0", path = "../fifolio-core" }
http-body-util = "0.1.5"
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "decimal"] }
utoipa-axum = "0.2.0"

[dev-dependencies]
# Core's unchecked writes, so a test can place a state the checked write path refuses.
fifolio-core = { path = "../fifolio-core", features = ["test-support"] }
fifolio-test-support = { workspace = true }
insta = "1.48.0"
rust_decimal_macros = "1.40.0"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "migrate"] }
tempfile = "3.27.0"
vec1 = "1.12.1"

[lints]
workspace = true
