[package]
name = "fifolio-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
fifolio-core = { version = "0.1.0", path = "../fifolio-core" }
http-body-util = "0.1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "decimal"] }
utoipa-axum = "0.2.0"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"

[lints]
workspace = true
