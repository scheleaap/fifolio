[package]
name = "fifolio-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
calamine = "0.36.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
csv = "1.4.0"
quick-xml = "0.42.0"
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "migrate", "macros", "chrono"] }
# `EnumCount` pins DOM-043's taxonomy to the enum that states it, so the set cannot grow
# without the test that counts it failing.
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
tracing = "0.1.44"

[dev-dependencies]
cargo-lock = { version = "11.1.0", default-features = false }
fifolio-test-support = { workspace = true }
insta = "1.48.0"
proptest = "1.11.0"
rust_decimal_macros = "1.40.0"
# Writing a minimal workbook, to reach the spreadsheet reader's whole-file refusals.
rust_xlsxwriter = "0.99.1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
